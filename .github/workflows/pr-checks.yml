name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contribution-policy:
    name: Contribution policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate issue-first policy and responsibility acknowledgement
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const trustedAssociations = new Set([
              'OWNER',
              'MEMBER',
              'COLLABORATOR',
            ]);

            if (
              pr.user?.type === 'Bot' ||
              trustedAssociations.has(pr.author_association)
            ) {
              core.notice(
                `Contribution policy gate skipped for ${
                  pr.user?.type === 'Bot' ? 'bot' : pr.author_association
                }.`,
              );
              return;
            }

            const body = pr.body || '';

            const responsibilityPattern =
              /^-\s*\[[xX]\].*<!--\s*contributor-responsibility\s*-->.*$/mi;
            if (!responsibilityPattern.test(body)) {
              core.setFailed(
                'Check the Contributor Responsibility acknowledgement in the PR template.',
              );
              return;
            }

            const referencePattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|related)\s+(?:#(\d+)|https:\/\/github\.com\/decentespresso\/decaid\/issues\/(\d+))/gi;
            const issueNumbers = [
              ...new Set(
                [...body.matchAll(referencePattern)].map((match) =>
                  Number(match[1] || match[2]),
                ),
              ),
            ];

            if (issueNumbers.length === 0) {
              core.setFailed(
                'External PRs must reference an accepted open issue using Fixes #123, Closes #123, Resolves #123, or Related #123.',
              );
              return;
            }

            const acceptedLabels = new Set([
              'ready-for-agent',
              'ready-for-human',
            ]);
            const rejected = [];

            for (const issue_number of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number,
                }));
              } catch (error) {
                if (error.status === 404) {
                  rejected.push(`#${issue_number} does not exist`);
                  continue;
                }
                throw error;
              }

              if (issue.pull_request) {
                rejected.push(`#${issue_number} is a pull request, not an issue`);
                continue;
              }

              if (issue.state !== 'open') {
                rejected.push(`#${issue_number} is not open`);
                continue;
              }

              const labels = new Set(
                issue.labels
                  .map((label) =>
                    typeof label === 'string' ? label : label.name,
                  )
                  .filter(Boolean),
              );
              const acceptedLabel = [...acceptedLabels].find((label) =>
                labels.has(label),
              );

              if (acceptedLabel) {
                core.notice(
                  `Accepted issue #${issue_number} (${acceptedLabel}).`,
                );
                return;
              }

              rejected.push(
                `#${issue_number} is missing ready-for-agent or ready-for-human`,
              );
            }

            core.setFailed(
              `No referenced issue satisfies the contribution policy: ${rejected.join(
                '; ',
              )}`,
            );

  changes:
    name: Detect relevant changes
    needs: contribution-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Python tool changes
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            tools tool/ci .github/workflows/pr-checks.yml; then
            echo "python=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "python=true" >> "$GITHUB_OUTPUT"
          fi

  flutter:
    name: Analyze / test
    needs: contribution-policy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Enforce contribution policy
        if: needs.contribution-policy.result != 'success'
        run: |
          echo "Contribution policy check failed; skipping test work." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test release aliases
        run: scripts/test_release_aliases.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter pub get
        run: flutter pub get

      # dart format reads the formatter: section of analysis_options.yaml
      # (page_width: 80). That include references package:flutter_lints, so
      # pub get must run first or the formatter config is silently dropped
      # and the check disagrees with locally formatted files.
      - name: Dart format check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --diff-filter=ACMR -z \
            "$BASE_SHA...$HEAD_SHA" -- '*.dart' | \
            xargs -0 -r dart format --output=none --set-exit-if-changed --

      # pubspec references external plugin assets and bundled skins. These
      # are build outputs, not checked in,
      # so populate them before any flutter command that touches assets
      # (analyze emits asset_directory_does_not_exist; test loads the
      # bundled_skins manifest at runtime).
      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tests only assert manifest shape (non-empty list of string IDs) and
      # `flutter analyze` only needs the asset dir to exist. Skip the real
      # bundler here — it makes 4+ unauthenticated api.github.com calls per
      # run and contributes nothing to test coverage. Develop/release
      # workflows still run the real bundler via flutter_with_commit.sh.
      - name: Stub bundled_skins (CI only)
        run: |
          mkdir -p assets/bundled_skins
          printf '["stub-skin"]\n' > assets/bundled_skins/manifest.json
          : > assets/bundled_skins/stub-skin.zip

      - name: Flutter analyze
        run: flutter analyze --no-pub

      # flutter_js' QuickJS bridge ships a prebuilt .so inside its pub-cache
      # checkout. macOS resolves it via @rpath automatically, but on Linux the
      # test runner needs LD_LIBRARY_PATH pointed at it.
      - name: Flutter test
        shell: bash
        run: |
          set -o pipefail
          QUICKJS_LIB_DIR=$(find "$HOME/.pub-cache/git" -path '*dart_js*/linux/shared' -type d | head -1)
          if [ -z "$QUICKJS_LIB_DIR" ]; then
            echo "Could not locate flutter_js native lib dir under ~/.pub-cache/git"
            exit 1
          fi
          echo "Using QuickJS lib dir: $QUICKJS_LIB_DIR"
          mkdir -p build/test-results
          LD_LIBRARY_PATH="$QUICKJS_LIB_DIR:${LD_LIBRARY_PATH:-}" \
            flutter test --no-pub --machine | \
            tee build/test-results/flutter-events.json

      - name: Gate slow test suites
        if: ${{ success() && hashFiles('build/test-results/flutter-events.json') != '' }}
        shell: bash
        run: |
          python3 tool/ci/summarize_flutter_tests.py \
            build/test-results/flutter-events.json \
            --max-active-ms 20000

      - name: Summarize Flutter tests
        if: ${{ always() && hashFiles('build/test-results/flutter-events.json') != '' }}
        continue-on-error: true
        run: python3 tool/ci/summarize_flutter_tests.py build/test-results/flutter-events.json

      - name: Upload Flutter test events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-events
          path: build/test-results/flutter-events.json
          if-no-files-found: ignore
          retention-days: 7

  build-smoke:
    name: Linux build smoke
    needs: contribution-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (unsigned)
        run: flutter build linux --release --no-pub

      - name: Verify internal data paths use Application Support, not Documents
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME"
          printf 'XDG_DOCUMENTS_DIR="$HOME"\n' > "$XDG_CONFIG_HOME/user-dirs.dirs"
          APP=./build/linux/x64/release/bundle/decaid
          PATHS=$(xvfb-run -a "$APP" --print-storage-paths)
          echo "$PATHS"
          echo "$PATHS" | grep -q '^support:' || {
            echo 'FAIL: missing support line' >&2
            exit 1
          }
          echo "$PATHS" | grep -q "$XDG_DATA_HOME" || {
            echo 'FAIL: support not under XDG_DATA_HOME' >&2
            exit 1
          }
          ! grep -qi documents <<<"$PATHS"
          ! grep -qF "$HOME" <<<"$PATHS"
          timeout 30 xvfb-run -a "$APP" --no-account || true
          find "$XDG_DATA_HOME" -name log.txt -print -quit | grep -q . || {
            echo 'FAIL: no log.txt after fresh start' >&2
            exit 1
          }

      - name: Install AppImage packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils librsvg2-dev libgirepository1.0-dev libglib2.0-bin libgtk-3-bin libgdk-pixbuf2.0-bin

      - name: Package Linux AppImage
        run: |
          scripts/package_appimage.sh \
            build/linux/x64/release/bundle \
            x86_64 0.0.0-test "$RUNNER_TEMP"

      - name: Verify AppImage structure and launch
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$RUNNER_TEMP/decaid-linux-x86_64-0.0.0-test.AppImage"
          scripts/verify_appimage.sh "$APPIMAGE" x86-64

  tools:
    name: Python tools tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test Python tools
        run: |
          python3 tools/analyze_weight_flow_test.py
          python3 tool/ci/summarize_flutter_tests_test.py
