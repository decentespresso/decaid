name: Development build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (push to main always builds all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - linux
          - raspberrypi
          - ios
          - windows

# bundle_skins.sh (invoked by flutter_with_commit.sh) hits api.github.com.
# Without auth, all jobs share the runner IP's 60 req/hr limit and silently
# get empty manifests. Expose GITHUB_TOKEN to every job so curl gets 5000/hr.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android APK
        run: ./flutter_with_commit.sh build apk --release
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Package Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk decaid-android-develop-${{ steps.build-id.outputs.short_sha }}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: decaid-android-develop
          path: decaid-android-develop-${{ steps.build-id.outputs.short_sha }}.apk
          if-no-files-found: error

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install automake and libtool
        run: brew install automake libtool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Import signing certificate ----
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Decode and import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          
          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Make this keychain the default
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          # Clean up
          rm certificate.p12

      # ---- Build ----
      - name: Build macOS app
        run: ./flutter_with_commit.sh build macos --release
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Codesign app (Developer ID, deepest-first)
        run: |
          # Never codesign --deep: it rewrites Sparkle's nested helpers with
          # the host entitlements, breaking the sandboxed Installer XPC.
          scripts/sign_macos_deepest_first.sh \
            build/macos/Build/Products/Release/Decaid.app

      - name: Verify signing gates (pre-notarization)
        run: |
          scripts/verify_macos_signature.sh \
            build/macos/Build/Products/Release/Decaid.app

      # ---- Notarize ----
      - name: Zip app for notarization
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Decaid.app Decaid.zip

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit \
            build/macos/Build/Products/Release/Decaid.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait 2>&1 | tee notarization.log
          # Show full log on failure
          if grep -q "status: Invalid" notarization.log; then
            ID=$(grep -o '[0-9a-f\-]\{36\}' notarization.log | head -1)
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          # Retry stapling — ticket propagation can lag behind notarytool --wait
          for i in 1 2 3 4 5; do
            if xcrun stapler staple build/macos/Build/Products/Release/Decaid.app; then
              exit 0
            fi
            echo "Staple attempt $i failed, waiting 15s..."
            sleep 15
          done
          echo "Stapling failed after 5 attempts"
          exit 1

      - name: Verify signed + notarized app (spctl + stapler)
        run: |
          scripts/verify_macos_signature.sh \
            build/macos/Build/Products/Release/Decaid.app XLS3XF57J8 1

      # ---- Upload ----
      - name: Create development ZIP
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Decaid.app ../../../../../decaid-macos-develop-${{ steps.build-id.outputs.short_sha }}.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-macos-develop
          path: decaid-macos-develop-${{ steps.build-id.outputs.short_sha }}.zip
          if-no-files-found: error

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (unsigned)
        run: ./flutter_with_commit.sh build linux --release
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../decaid-linux-x64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz bundle

      - name: Upload Linux app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-linux-x64-develop
          path: decaid-linux-x64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz
          if-no-files-found: error

  build-raspberrypi:
    name: Build for Raspberry Pi (ARM64 / Pi 4+)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'raspberrypi'
    runs-on: ubuntu-22.04-arm     # ARM64 hosted runner label
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          # Flutter publishes no prebuilt arm64 Linux SDK; the master channel
          # path lets flutter-action git-clone the tagged version instead.
          channel: 'master'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Run git safe dir
        run: git config --global --add safe.directory /opt/hostedtoolcache/flutter/${{ steps.flutter-action.outputs.CHANNEL }}-${{ steps.flutter-action.outputs.VERSION }}-${{ steps.flutter-action.outputs.ARCHITECTURE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux app (ARM64)
        run: ./flutter_with_commit.sh build linux --release
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Create Raspberry Pi archive
        run: |
          cd build/linux/arm64/release
          tar -czf ../../../../decaid-linux-arm64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz bundle

      - name: Upload Raspberry Pi build (ARM64)
        uses: actions/upload-artifact@v7
        with:
          name: decaid-linux-arm64-develop
          path: decaid-linux-arm64-develop-${{ steps.build-id.outputs.short_sha }}.tar.gz
          if-no-files-found: error

  build-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: xcodes select 26.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build IPA
        run: ./flutter_with_commit.sh build ipa --release --dart-define=APP_STORE=true --no-codesign
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          OUTPUT_PATH="$GITHUB_WORKSPACE/decaid-ios-unsigned-develop-${{ steps.build-id.outputs.short_sha }}.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"

          test -d "$APP_PATH"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          cd "$PACKAGE_DIR"
          zip -qry "$OUTPUT_PATH" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: decaid-ios-unsigned-develop
          path: decaid-ios-unsigned-develop-${{ steps.build-id.outputs.short_sha }}.ipa
          if-no-files-found: error


  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    # Pinned: windows-latest rolled to VS 18 / MSVC 14.51, which hard-errors on
    # <experimental/coroutine> still used by flutter_inappwebview_windows and
    # permission_handler_windows. Revisit when plugins migrate to C++20 <coroutine>.
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build identifier
        id: build-id
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true
          pub-cache: true

      - name: Install nuget
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch external plugins
        shell: bash
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows app (unsigned)
        shell: bash
        run: ./flutter_with_commit.sh build windows --release
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath decaid-windows-x64-develop-${{ steps.build-id.outputs.short_sha }}.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: decaid-windows-x64-develop
          path: decaid-windows-x64-develop-${{ steps.build-id.outputs.short_sha }}.zip
          if-no-files-found: error




