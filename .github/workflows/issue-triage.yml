name: Label new issues for triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-new-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply needs-triage
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage'],
            });
