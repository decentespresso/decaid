  # REA Key-Value Store for clients
  /api/v1/store/{namespace}:
    get:
      summary: List keys in a namespace, or read the whole namespace with `?full=1`
      description: >
        By default returns an array of the keys stored under the namespace.
        With `?full=1` returns the entire namespace as a `{key: value}` map in a
        single request (instead of one GET per key). The full response supports
        conditional requests: it sends an `ETag`, and an `If-None-Match` request
        whose value matches returns `304 Not Modified`, which makes polling the
        whole namespace cheap.
      tags: [Key value store]
      parameters:
        - name: namespace
          value: default
          in: path
          required: true
          schema:
            type: string
        - name: full
          in: query
          required: false
          description: "Set to `1` to return the whole namespace as a `{key: value}` map instead of a list of keys."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: >
            Array of keys, or — when `?full=1` is set — an object mapping each
            key to its stored JSON value.
          headers:
            ETag:
              description: Present for `?full=1` responses; pass back via `If-None-Match` to poll cheaply.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: string
                  - type: object
                    additionalProperties: true
        "304":
          description: Returned for a `?full=1` request whose `If-None-Match` matches the current namespace ETag.

  /api/v1/store/{namespace}/{key}:
    get:
      summary: Get value for a key
      tags: [Key value store]
      parameters:
        - name: namespace
          value: default
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JSON value stored under the key
          content:
            application/json:
              schema: {}
        "404":
          description: Key not found

    post:
      summary: Set value for a key
      tags: [Key value store]
      parameters:
        - name: namespace
          value: default
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "204":
          description: Successfully stored

    delete:
      summary: Delete key
      tags: [Key value store]
      parameters:
        - name: namespace
          value: default
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "404":
          description: Key not found

  /api/v1/plugins:
    get:
      summary: List all plugins
      description: Returns all installed plugins with their manifests, load state, and auto-load preference
      tags: [Plugins]
      responses:
        "200":
          description: A list of all installed plugin manifests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PluginManifest'

  /api/v1/plugins/{id}/settings:
    get:
      tags: [Plugins]
      summary: Fetch settings for specific plugin
      description: Secure settings are represented by an isSet state object and never returned as plaintext.
      parameters:
        - name: id
          in: path
          required: true
          description: the plugin id
          schema:
            type: string
      responses:
        "200":
          description: Current settings with secure values redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSettings'

    post:
      tags: [Plugins]
      summary: Save settings for specific plugin
      description: >
        Applies a settings patch. Omitted fields preserve the existing value;
        a null value clears the setting. For secure fields, an isSet state
        object preserves the stored credential; null clears it. The response
        is always redacted and never echoes a submitted credential.
      parameters:
        - name: id
          in: path
          required: true
          description: the plugin id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginSettings'
      responses:
        "200":
          description: Updated settings with secure values redacted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSettings'

  /api/v1/plugins/{id}/enable:
    post:
      summary: Enable a plugin
      description: Enables and loads the specified plugin
      tags: [Plugins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        "200":
          description: Plugin enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string

  /api/v1/plugins/{id}/disable:
    post:
      summary: Disable a plugin
      description: Disables and unloads the specified plugin
      tags: [Plugins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        "200":
          description: Plugin disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string

  /api/v1/plugins/{id}:
    delete:
      summary: Delete a plugin
      description: Removes a plugin from the system
      tags: [Plugins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        "200":
          description: Plugin deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string

  /api/v1/plugins/{id}/{endpoint}:
    get:
      summary: Call a plugin HTTP endpoint
      description: >
        Routes the request to a loaded plugin's declared HTTP endpoint. The
        runtime applies this contract to every HTTP method. The plugin manifest
        must declare the api permission; otherwise Decaid rejects the request
        before dispatch.
      tags: [Plugins]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
          description: Plugin-declared HTTP endpoint ID
      responses:
        "403":
          description: Plugin manifest does not declare the api permission
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "PluginPermissionError: Plugin example.plugin requires manifest permission api"
        default:
          description: Plugin-defined status, headers, and body

  /api/v1/plugins/install:
    post:
      summary: Install a plugin from URL
      description: Installs a plugin from a remote URL (not yet implemented)
      tags: [Plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL to install the plugin from
      responses:
        "501":
          description: Not yet implemented
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "400":
          description: Missing url field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # Profiles API
  # 
  # REA uses content-based hashing for profile identification:
  # - Profile Hash (ID): Calculated from execution-relevant fields (beverage_type, steps, tank_temperature, 
  #   target_weight, target_volume, target_volume_count_start, legacy_profile_type, type, version)
  # - Metadata Hash: Calculated from presentation fields (title, author, notes)
  # - Compound Hash: Combined hash of both, used for full change detection
  #
  # Benefits:
  # - Automatic deduplication: Identical profiles have identical IDs across all devices
  # - Cloud sync friendly: No ID conflicts when syncing between devices
  # - Version tracking: Changes to execution fields create new profile IDs
  #
  /api/v1/profiles:
    get:
      summary: Get all profiles
      description: Retrieves all profiles, optionally filtered by visibility or parent ID
      tags: [Profiles]
      parameters:
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [visible, hidden, deleted]
          description: Filter profiles by visibility state
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include hidden profiles in results
        - name: parentId
          in: query
          required: false
          schema:
            type: string
          description: Filter profiles by parent ID (for version tracking)
      responses:
        "200":
          description: Array of profile records
          headers:
            ETag:
              schema:
                type: string
              description: |
                Strong entity tag derived from the response body. Echo back as
                `If-None-Match` on subsequent requests for conditional GET.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileRecord'
        "304":
          description: Not Modified — client's `If-None-Match` matched the current ETag.
        "400":
          description: Bad Request (invalid visibility value)
        "500":
          description: Internal Server Error
    
    post:
      summary: Create new profile
      description: Creates a new profile record with optional parent reference
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  $ref: '#/components/schemas/Profile'
                parentId:
                  type: string
                  nullable: true
                  description: ID of parent profile (for versioning)
                metadata:
                  type: object
                  nullable: true
                  description: Additional metadata
      responses:
        "201":
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRecord'
        "400":
          description: Bad Request (missing required fields or invalid parent ID)
        "500":
          description: Internal Server Error

  /api/v1/profiles/{id}:
    get:
      summary: Get profile by ID
      description: Retrieves a single profile record by its ID
      tags: [Profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Profile ID
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRecord'
        "404":
          description: Profile not found
        "500":
          description: Internal Server Error
    
    put:
      summary: Update profile
      description: Updates an existing profile. Cannot modify default profiles' content, only metadata.
      tags: [Profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Profile ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  $ref: '#/components/schemas/Profile'
                  nullable: true
