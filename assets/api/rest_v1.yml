                  nullable: true
                harvestDate:
                  type: string
                  nullable: true
                qualityScore:
                  type: number
                  format: double
                  nullable: true
                price:
                  type: number
                  format: double
                  nullable: true
                currency:
                  type: string
                  nullable: true
                weight:
                  type: number
                  format: double
                  nullable: true
                  description: Total weight in grams. weightRemaining is auto-set to this value.
                buyDate:
                  type: string
                  format: date-time
                  nullable: true
                openDate:
                  type: string
                  format: date-time
                  nullable: true
                bestBeforeDate:
                  type: string
                  format: date-time
                  nullable: true
                freezeDate:
                  type: string
                  format: date-time
                  nullable: true
                unfreezeDate:
                  type: string
                  format: date-time
                  nullable: true
                frozen:
                  type: boolean
                notes:
                  type: string
                  nullable: true
                extras:
                  type: object
                  nullable: true
                  additionalProperties: true
            examples:
