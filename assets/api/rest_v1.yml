        "500":
          description: Internal Server Error

  /api/v1/profiles/import:
    post:
      summary: Import profiles
      description: Batch import profiles from JSON array (e.g., from backup)
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfileRecord'
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                    description: Number of profiles successfully imported
                  skipped:
                    type: integer
                    description: Number of profiles skipped (already exist)
                  failed:
                    type: integer
                    description: Number of profiles that failed to import
                  errors:
                    type: array
                    items:
                      type: string
                    description: Error messages for failed imports
        "500":
          description: Internal Server Error

  /api/v1/profiles/export:
    get:
      summary: Export profiles
      description: Exports all profiles as JSON array for backup
      tags: [Profiles]
      parameters:
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include hidden profiles in export
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include deleted profiles in export
      responses:
        "200":
          description: Profiles exported successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileRecord'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="profiles_export.json"'
        "500":
          description: Internal Server Error

  /api/v1/profiles/restore/{filename}:
    post:
      summary: Restore default profile
      description: Restores a bundled default profile from assets by filename
      tags: [Profiles]
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: Filename of the default profile in assets
      responses:
        "200":
          description: Default profile restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRecord'
        "404":
          description: Default profile not found
        "500":
          description: Internal Server Error

  /api/v1/profiles/defaults:
    get:
      summary: List bundled default profiles
      description: |
        Returns the entries from the bundled defaults manifest
        (`assets/defaultProfiles/manifest.json`) with their human-readable
        metadata. Use the `filename` from each entry as the `{filename}` path
        parameter for `POST /api/v1/profiles/restore/{filename}`.

        Returns an empty array when the manifest is missing or unreadable;
        per-file parse failures are skipped and logged server-side.
      tags: [Profiles]
      responses:
        "200":
          description: Array of bundled default profile descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DefaultProfileDescriptor'
        "500":
          description: Internal Server Error

  /api/v1/webui/skins:
    get:
      summary: List all installed WebUI skins
      description: Returns a list of all installed WebUI skins with their metadata
      tags: [WebUI]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebUISkin'
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/{id}:
    get:
      summary: Get specific WebUI skin details
      description: Returns details for a specific WebUI skin by ID
      tags: [WebUI]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Skin ID
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUISkin'
        "404":
          description: Skin not found
        "500":
          description: Internal Server Error
    delete:
      summary: Remove/uninstall a WebUI skin
      description: Removes a user-installed WebUI skin (bundled skins cannot be removed)
      tags: [WebUI]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Skin ID
      responses:
        "200":
          description: Skin removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  id:
                    type: string
        "403":
          description: Cannot remove bundled skin
        "404":
          description: Skin not found
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/default:
    get:
      summary: Get the default WebUI skin
      description: Returns the default skin based on user preference (defaults to 'streamline-project')
      tags: [WebUI]
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUISkin'
        "404":
          description: No default skin available
        "500":
          description: Internal Server Error
    put:
      summary: Set the default WebUI skin
      description: Sets the user's preferred default skin by ID and persists to preferences
      tags: [WebUI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - skinId
              properties:
                skinId:
                  type: string
                  description: ID of the skin to set as default
                  example: "my-nextjs-skin"
      responses:
        "200":
          description: Default skin updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  skinId:
                    type: string
        "400":
          description: Bad request (missing skinId field)
        "404":
          description: Skin not found
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/install/github-release:
    post:
      summary: Install skin from GitHub Release
      description: Downloads and installs a WebUI skin from a GitHub Release using the GitHub API
      tags: [WebUI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo
              properties:
                repo:
                  type: string
                  description: GitHub repository in format "owner/repo"
                  example: "username/my-skin-repo"
                asset:
                  type: string
                  description: Optional specific asset name to download (e.g., "my-skin.zip"). If not provided, downloads first .zip asset
                  example: "my-skin.zip"
                prerelease:
                  type: boolean
                  description: Whether to include pre-release versions
                  default: false
      responses:
        "200":
          description: Skin installed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  repo:
                    type: string
        "400":
          description: Bad request (missing repo field)
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/install/github-branch:
    post:
      summary: Install skin from GitHub branch
      description: Downloads and installs a WebUI skin from a GitHub branch archive, persisting the branch source for future update checks
      tags: [WebUI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo
              properties:
                repo:
                  type: string
                  description: GitHub repository in format "owner/repo"
                  example: "username/my-skin-repo"
                branch:
                  type: string
                  description: Branch name to download from
                  default: "main"
                  example: "main"
      responses:
        "200":
          description: Skin installed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  repo:
                    type: string
                  branch:
                    type: string
        "400":
          description: Bad request (missing repo field)
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/install/url:
    post:
      summary: Install skin from URL
      description: Downloads and installs a WebUI skin from a direct ZIP URL
      tags: [WebUI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: Direct URL to a .zip file containing the skin
                  example: "https://example.com/skin.zip"
      responses:
        "200":
          description: Skin installed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  url:
                    type: string
        "400":
          description: Bad request (missing url field)
        "500":
          description: Internal Server Error

  /api/v1/webui/skins/update:
    post:
      summary: Check for skin updates
      description: Triggers an update check for all skins from their remote sources (GitHub releases, branches). Skins with newer versions available will be downloaded and updated.
      tags: [WebUI]
      responses:
        "200":
          description: Update check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
