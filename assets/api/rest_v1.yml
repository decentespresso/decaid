      tags: [Profiles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Profile ID
      responses:
        "200":
          description: Profile permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
