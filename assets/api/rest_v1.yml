                  roastLevel: "medium-light"
                  weight: 250
              detailedBatch:
                summary: Detailed batch with pricing
                value:
                  roastDate: "2026-02-28T00:00:00Z"
                  roastLevel: "medium-light"
                  weight: 250
                  price: 18.50
                  currency: "EUR"
                  qualityScore: 87.5
      responses:
        "201":
          description: Batch created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeanBatch"
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error

  /api/v1/bean-batches/{id}:
